type Query {
  users: [User]!
  posts: [Post]!
  comments: [Comment]!
  user(id: ID!): User
}

type Mutation {
  createUser(data: CreateUserInput!): User!
  createPost(data: CreatePostInput!): Post!
  createComment(data: CreateCommentInput!): Comment!
  updateUser(id: ID!, name: String, email: String, location: String, age: Int): User!
  deleteUser(id: ID!): User!
}

type Subscription {
  count: Int!
  comment(postId: ID!): Comment!
}

type User {
  id: ID!
  name: String!
  email: String!
  location: String!
  age: Int
  posts: [Post!]!
}

type Post {
  id: ID!
  title: String!
  body: String!
  published: Boolean!
  author: User!
  comments: [Comment!]!
}

type Comment {
  id: ID!
  text: String!
  author: User!
  post: Post!
}

input CreateUserInput {
  name: String!
  email: String!
  location: String!
  age: Int
}

input CreatePostInput {
  title: String!
  body: String!
  published: Boolean!
  author: ID!
}

input CreateCommentInput {
  text: String!
  author: ID!
  post: ID!
}